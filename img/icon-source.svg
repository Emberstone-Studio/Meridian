<!-- The one Meridian mark. Raster master for icon16/32/48/128.png (manifest
     "icons" + "default_icon"), and the artwork utils/toolbarIcon.js rasterises
     for the browser action, which is the same icon Chrome shows in the
     extensions overflow menu. Render with:
     inkscape -w N -h N img/icon-source.svg -o img/iconN.png

     The disc fill below is rewritten per colour scheme at runtime (mint on dark
     chrome, a darker step of the same hue on light chrome). Keep it a literal
     hex on the circle element, or that rewrite silently stops matching.

     Ink counter, not a knockout. These PNGs are composited over backgrounds we
     cannot predict: the extensions page, the Web Store grid, the puzzle-piece
     overflow menu, in either theme. A knocked-out M is a transparent hole, so
     on a light backdrop it becomes light-on-mint at 1.67:1 and the letterform
     disappears. Filling the counter with the brand ink puts the M at 7.95:1
     against the mint and makes one static artwork safe everywhere.

     Keep this comment free of doubled hyphens; XML forbids them inside a
     comment and some renderers reject the file outright. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 104 104"
     role="img" aria-label="Meridian">
  <circle cx="64" cy="64" r="52" fill="#2ed8b0"/>
  <path d="M44 84V44l20 24 20-24v40" fill="none" stroke="#0d2f28"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
