<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Meridian — Chrome Web Store small promotional tile (440 x 280)
  EDITABLE SOURCE. Final export: store-assets/promo-tile-440x280.png

  Brand system (sourced from the repo):
    - Signature "Ocean" gradient : linear-gradient(135deg,#0f2027,#203a43,#2c5364)
      (components/SettingsPanel.js DEFAULT_BG / Ocean preset)
    - Accent (teal, hue 197)     : hsl(197 100% 52%)  (meridian.css --accent)
    - Ink / light surfaces       : #1c1c1e / #f5f5f7  (icon-source.svg)
    - Type                       : system-ui stack    (meridian.css body)
    - Mark                       : ring + flame strokes from img/Meridian.svg

  Render at native size with Chrome headless:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
           --window-size=440,280 --screenshot=out.png promo-tile-440x280.html
-->
<style>
  :root {
    --ink: #0f2027;
    --light: #f5f5f7;
    --accent: hsl(197 100% 55%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 440px; height: 280px; }

  .tile {
    position: relative;
    width: 440px;
    height: 280px;
    overflow: hidden;
    /* Signature Ocean gradient — full bleed, no transparent corners. */
    background: linear-gradient(135deg, #0f2027 0%, #17303a 42%, #203a43 68%, #2c5364 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    isolation: isolate;
  }

  /* Depth: a soft teal glow anchored behind the mark. */
  .glow {
    position: absolute;
    top: -70px;
    left: 40px;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle at center,
                  hsla(197, 100%, 55%, 0.28) 0%,
                  hsla(197, 100%, 55%, 0.10) 34%,
                  transparent 66%);
    filter: blur(2px);
    z-index: 0;
  }

  /* Abstract "spatial lanes" texture — evokes the tab-card grid without being
     a screenshot. Kept very low opacity so it reads as depth, not UI. */
  .lanes {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
  }
  .lanes .card {
    position: absolute;
    border-radius: 9px;
    background: rgba(245, 245, 247, 0.05);
    border: 1px solid rgba(245, 245, 247, 0.06);
  }

  /* Fine vignette to keep the corners rich and the center legible. */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(120% 120% at 50% 45%,
                  transparent 55%, rgba(0, 0, 0, 0.28) 100%);
    pointer-events: none;
  }

  .lockup {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 0 40px;
  }

  .mark {
    flex: 0 0 auto;
    width: 128px;
    height: 128px;
    filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
  }
  .mark svg { display: block; width: 100%; height: 100%; }
  .mark .stroke { fill: var(--light); }
  .mark .ring   { fill: var(--accent); }

  .words { display: flex; flex-direction: column; }

  .wordmark {
    font-size: 50px;
    font-weight: 600;
    letter-spacing: -1.2px;
    line-height: 1;
    color: var(--light);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .rule {
    margin: 14px 0 12px;
    width: 46px;
    height: 4px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 12px hsla(197, 100%, 55%, 0.7);
  }

  .tagline {
    font-size: 16px;
    font-weight: 450;
    letter-spacing: 0.1px;
    color: rgba(245, 245, 247, 0.74);
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="glow"></div>

    <div class="lanes">
      <!-- three faint offset lanes, lower-right, suggesting workspace columns -->
      <div class="card" style="left:250px; top:150px; width:150px; height:34px;"></div>
      <div class="card" style="left:250px; top:194px; width:150px; height:34px;"></div>
      <div class="card" style="left:250px; top:238px; width:150px; height:34px;"></div>
      <div class="card" style="left:36px;  top:206px; width:120px; height:30px;"></div>
      <div class="card" style="left:36px;  top:244px; width:120px; height:30px;"></div>
    </div>

    <div class="vignette"></div>

    <div class="lockup">
      <div class="mark">
        <!-- Ring + flame strokes from img/Meridian.svg -->
        <svg viewBox="0 0 124.33 124.33" xmlns="http://www.w3.org/2000/svg">
          <g class="stroke">

            <path d="M51.91,41.4c5.19-6.49,8.77-10.71,10.75-12.65,2.07-1.98,3.77-2.97,5.12-2.97.84,0,1.67.38,2.47,1.14.97.89,1.46,1.9,1.46,3.04,0,1.26-.89,3.35-2.66,6.26-5.06,8.26-9.72,17.54-13.98,27.82-3.67,9.27-6.03,17.14-7.08,23.59,1.35-1.98,4.47-6.74,9.36-14.29,4.17-6.45,10.83-15.75,19.98-27.89,5.31-7.04,10.12-12.94,14.42-17.71.39-.43.77-.82,1.14-1.19-8.24-7.12-18.97-11.43-30.72-11.43-25.98,0-47.05,21.06-47.05,47.05,0,9.03,2.55,17.45,6.95,24.62,8.56-16.01,18.49-31.14,29.84-45.39Z"/>
            <path d="M99.78,33.91c-.44.81-2.15,3.83-5.13,9.07-5.56,9.86-9.34,16.91-11.32,21.12-5.44,11.55-9.42,21.4-11.95,29.53-1.48,4.85-2.21,8.41-2.21,10.69,0,.51.04,1.03.13,1.58.18,1.4.28,2.3.31,2.73,22.45-3.57,39.61-23.01,39.61-46.46,0-10.6-3.51-20.39-9.43-28.26Z"/>
          </g>
          <path class="ring" d="M62.17,124.33C27.89,124.33,0,96.44,0,62.17S27.89,0,62.17,0s62.17,27.89,62.17,62.17-27.89,62.17-62.17,62.17ZM62.17,8c-29.87,0-54.17,24.3-54.17,54.17s24.3,54.17,54.17,54.17,54.17-24.3,54.17-54.17S92.03,8,62.17,8Z"/>
        </svg>
      </div>

      <div class="words">
        <div class="wordmark">Meridian</div>
        <div class="rule"></div>
        <div class="tagline">Spatial tab command center</div>
      </div>
    </div>
  </div>
</body>
</html>
