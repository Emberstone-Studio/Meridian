<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian — small promo tile 440x280</title>
<style>
  /* Fonts resolve from the repo root, two levels up from store-assets/src/.
     If the wordmark renders in a generic sans, this path is wrong: with
     font-display the miss is silent and simply keeps the fallback forever. */
  @font-face {
    font-family: "Rubik";
    src: url("../../fonts/Rubik-latin.woff2") format("woff2-variations");
    font-weight: 300 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    --brand: #2ed8b0;
    --ground: #1c1c1e;
    --fg: #f5f5f7;
    --muted: #98989d;
  }

  html, body { margin: 0; padding: 0; }
  body {
    width: 440px; height: 280px;
    background: var(--ground);
    font-family: "Rubik", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 21px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* Tight viewBox: the disc spans 12..116 of a 128 box, so the full frame
     carries 9.4% transparent padding per side. Flex sizes the box, not the
     ink, so that padding would silently widen the gap beside the mark. */
  .lockup { display: flex; align-items: center; gap: 16px; }
  .mark { display: block; flex-shrink: 0; }

  /* Always caps, weight 500, .14em. letter-spacing appends its space after the
     FINAL letter too, so the negative margin cancels that phantom trailing gap
     and lets the lockup optically center. */
  .wordmark {
    font-weight: 500; font-size: 40px; line-height: 1;
    text-transform: uppercase; letter-spacing: .14em; margin-right: -.14em;
    color: var(--fg);
  }

  .tagline {
    font-weight: 400; font-size: 14.5px; line-height: 1;
    letter-spacing: .055em; color: var(--muted);
  }
</style>
</head>
<body>

  <div class="lockup">
    <!-- Dark ground, so the M is a true knockout: an actual hole, with the disc
         reading 9.37:1 against #1c1c1e. -->
    <svg class="mark" viewBox="12 12 104 104" width="68" height="68" aria-hidden="true">
      <mask id="meridian-m">
        <rect width="128" height="128" fill="#fff"/>
        <path d="M44 84V44l20 24 20-24v40" fill="none" stroke="#000"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </mask>
      <circle cx="64" cy="64" r="52" fill="var(--brand)" mask="url(#meridian-m)"/>
    </svg>
    <span class="wordmark">Meridian</span>
  </div>

  <p class="tagline">Spatial tab command center</p>

</body>
</html>
