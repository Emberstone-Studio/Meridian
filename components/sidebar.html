<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Meridian</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div id="sidebar-wrap">

      <div id="search-zone">
        <div id="sidebar-search">
          <button
            id="meridian-btn"
            type="button"
            title="Open Meridian dashboard"
            aria-label="Open Meridian dashboard"
          >
            <svg
              id="sidebar-logo"
              viewBox="0 0 20 20"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <rect x="2.5" y="2.5" width="6" height="6" rx="1.25" />
              <rect x="11.5" y="2.5" width="6" height="6" rx="1.25" />
              <rect x="2.5" y="11.5" width="6" height="6" rx="1.25" />
              <rect x="11.5" y="11.5" width="6" height="6" rx="1.25" />
            </svg>
          </button>
          <input
            id="search-input"
            type="text"
            placeholder="Search anything…"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="search-clear-btn"
            class="hidden"
            type="button"
            aria-label="Clear search"
          >×</button>
          <div id="search-scopes">
            <button
              id="scope-bookmarks"
              class="scope-chip"
              type="button"
              aria-pressed="false"
              aria-label="Search bookmarks"
              title="Bookmarks"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
              </svg>
            </button>
            <button
              id="scope-history"
              class="scope-chip"
              type="button"
              aria-pressed="false"
              aria-label="Search history"
              title="History"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
                <path d="M12 7v5l3 2" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="tab-list"></div>

      <div id="sidebar-footer">
        <button id="new-tab-btn" type="button" title="New Tab">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="8" y1="2" x2="8" y2="14" />
            <line x1="2" y1="8" x2="14" y2="8" />
          </svg>
          <span id="new-tab-label">New Tab</span>
        </button>
      </div>

    </div>
    <script type="module" src="sidebar.js"></script>
  </body>
</html>
