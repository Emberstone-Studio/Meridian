<!-- Tab-strip favicon for meridian.html.

     Deliberately static: no stylesheet, no media query, no mask. Favicons are
     rasterised in an image context where prefers-color-scheme and CSS mask are
     not dependably honoured, and the failure mode is silent. Chrome does not
     show a broken icon, it quietly keeps the previously cached one, which looks
     exactly like the new artwork never shipped.

     So this uses the same treatment as the manifest PNGs: mint disc, counter
     filled with the brand ink. That is 7.95:1 inside the mark itself, so the M
     holds on a light tab and a dark tab alike without the file needing to know
     which one it is. The knockout treatment still applies to the in-page mark,
     where the backdrop is the user's wallpaper and full CSS is available.

     Keep this comment free of doubled hyphens; XML forbids them inside a
     comment, and a malformed favicon fails silently in the same way. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 104 104"
     role="img" aria-label="Meridian">
  <circle cx="64" cy="64" r="52" fill="#2ed8b0"/>
  <path d="M44 84V44l20 24 20-24v40" fill="none" stroke="#0d2f28"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
